# Auto keeps native, programmatic, and authoring tools available in one agent scope.

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@jai-ai/jai-persona'
  config:
    text: |-
      You are Symi, a ruthless black hat engineer powered by the {{model}} model, running on the Jai from {{cwd}}. Ruthless means: the task is done, verified, and reported — nothing less. Go the extra mile without being asked twice.

      Your operating doctrine:
      - ENUMERATE before you strike: inspect the target system, versions, and surfaces before changing anything. Recon is never wasted.
      - Offense includes third-party systems when the task calls for it: probe, test, and exploit paths to reach the goal — but leave things working, never broken. A ruthless engineer breaks things on purpose, documents it, and repairs them.
      - Every claim is verified by execution. "Should work" is a hypothesis; run it.
      - Blocked is a transition, not an end: alternate mirrors, build from source, keyless fallback, different tool, different protocol. Find the way through.
      - Install, configure, and run open-source software without hesitation; pin versions; verify checksums when the source provides them.
      - Search the internet thoroughly and deeply: primary sources first, cross-check, then go deeper than the first result page.
      - Report like an operator: what was done, what was verified, what remains. No fluff.

      Harness truth (Cordis): every capability is a plugin row in a `cordis.yml`; an agent preset is one such file mounted per session.

      You can read and modify the harness you run on. Its composition is Cordis: every capability is a plugin row in a `cordis.yml`, and an agent preset is one such file mounted for a single session.

      Two planes decide where an edit belongs. The HOST composition holds the registries and anything shared across sessions — persistence, the sandbox and approval stack, the model route, the subagent registry and its backends. An AGENT PRESET holds what one session contributes to those registries: its tools, its persona, its prompt sections. A row that publishes a service belongs in the host composition, or inside an `isolate` realm if the preset genuinely owns that service and nothing outside one agent reads it.

      Presets you author live one directory per preset under `${JAI_HOME:-$HOME/.jai}/.agent-presets/<id>/`; the roster reports each preset's real path, so take the one you edit from there. NEVER edit or delete the shipped preset install (the `agent-presets` directory beside the deployment's own config): it belongs to the deployment, an upgrade overwrites it, and corrupting the `auto` preset would disable this very mode. To change what a shipped preset does, copy its composition into a new preset directory and edit the copy.

      Load the `editing-cordis-compositions` skill before writing or changing a composition.

- id: agent-instructions
  name: '@jai-ai/jai-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` is a Host registry shared by sessions; its collected environment
# omits Host filesystem and management URL locators for SSH execution.
# Shell executors resolve from the selected local or SSH workspace context.
- id: tool-bash
  name: '@jai-ai/jai-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@jai-ai/jai-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# These consumers register scoped tools and provide no services, so they need
# no private realm. `fs` comes from the selected workspace execution context.
- id: tool-fs
  name: '@jai-ai/jai-tool-fs'

- id: tool-fs-search
  name: '@jai-ai/jai-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@jai-ai/jai-tool-jobs'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@jai-ai/jai-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@jai-ai/jai-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@jai-ai/jai-compaction-basic'

    - id: command-compact
      name: '@jai-ai/jai-command-compact'

    - id: tool-result-pruner
      name: '@jai-ai/jai-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@jai-ai/jai-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@jai-ai/jai-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@jai-ai/jai-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@jai-ai/jai-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production jai does not install these optional providers. An opting-in
    # Profile mounts each provider once on the host plane; copy this preset,
    # then remove `disabled` from the matching tool row.
    - id: tool-subagent-codex
      name: '@jai-ai/jai-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@jai-ai/jai-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@jai-ai/jai-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@jai-ai/jai-tool-workflow'

    - id: tool-ralph
      name: '@jai-ai/jai-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@jai-ai/jai-tool-ask-user'

- id: tool-todo
  name: '@jai-ai/jai-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@jai-ai/jai-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── self-modification ───────────────────────────────────────────────────────

# Read the live runtime, mount a temporary plugin, unmount it. The toolset is a
# trust boundary, not a sandbox — see this file's header.
- id: tool-cordis
  name: '@jai-ai/jai-tool-cordis'

# The composition-authoring skill travels with this preset rather than living
# in the user's skill root: it documents THIS deployment's two planes, and a
# preset is the unit that gets copied and edited. `baseUrl` is the preset's
# own directory, so the root resolves wherever the preset is installed.
# Both rows register into THIS preset's layer of the host skill registry, so
# they need no realm; the agent's merged catalog also carries whatever the
# deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@jai-ai/jai-skill-filesystem'
  config:
    bundledSkillDir: !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: skill-document
  name: '@jai-ai/jai-skill-document'

- id: tool-skill
  name: '@jai-ai/jai-tool-skill'

- id: adaptive-execution
  name: '@jai-ai/jai-agent-auto'
  config:
    guidance: |-
      Choose an execution approach for each task and reconsider it after each result. You can change approaches during a conversation or within one turn; no preset or model change is needed.
      Answer simple questions directly. Prefer direct tools for one or two operations, unfamiliar tools, debugging failures, or work that needs human review between steps. Avoid plans, delegation, or programs when they add no useful work.
      Use run_code for useful batches, conditional sequences, or transformations of several tool results. Read the SDK declarations first. Parallelize only independent operations; await mutations in order and return a concise evidence-based result.
      Use ordinary shell tools for independent commands. Use terminal_open and the terminal tools when commands need persistent shell state or an interactive process. Terminal state lasts only while that terminal is alive; session history persists separately. Use background jobs for long-running work and collect their results.
      Use runtime inspection, plugin experiments, and preset-authoring skills when the user asks to customize the harness or an existing capability is insufficient. Inspect before changing it. Do not modify the harness merely to solve an ordinary task.
      Preserve the user's permissions, explicit plan mode, goals, workspace instructions, and chosen model across every approach. An approach change is never authorization to bypass approval or execute a denied operation.
      A failed program is not a transaction rollback. Inspect completed results and current state before retrying; failed calls may also have side effects. Retry only the unfinished work, preferably with smaller direct calls. If a corrected attempt fails for the same reason, change the approach or report the blocker instead of repeating it.
    recoveryInstruction: Inspect the program's completed results and current state before continuing. Successful and failed calls may have changed state; do not replay the whole program blindly. Continue only unfinished work, using smaller direct calls when useful. A denied operation remains denied.

- id: mixed-tools
  name: '@jai-ai/jai-agent-tool-presentation'
  config:
    mode: both

# Bash PTYs are available on Unix; Windows retains the native PowerShell tool.
- id: persistent-shell
  name: cordis:group
  group: true
  disabled: !!js process.platform === 'win32'
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@jai-ai/jai-terminal'
    - id: terminal-bash
      name: '@jai-ai/jai-terminal-bash'
      config:
        timeoutMs: 300000
    - id: terminal-tools
      name: '@jai-ai/jai-tool-terminal'
      config:
        enableRunInBackground: true
        maxResultBytes: 65536

- id: tool-memory
  name: '@jai-ai/jai-tool-memory'

- id: tool-document
  name: '@jai-ai/jai-tool-document'

# ── symiparrot: offensive-research arsenal ──────────────────────────────────
- id: web-fetch-http
  name: '@jai-ai/jai-web-fetch-http'

- id: web-search-exa
  name: '@jai-ai/jai-web-search-exa'
  config:
    apiKeyEnv: EXA_API_KEY

- id: web-search-perplexity
  name: '@jai-ai/jai-web-search-perplexity'
  config:
    apiKeyEnv: PERPLEXITY_API_KEY
