# tmux wheel scrolling for the Symi CLI
#
# Problem: the CLI runs in the alternate screen and enables DECSET 1007, but it
# does NOT enable mouse tracking — it scrolls on Up/Down/PageUp/PageDown.
# tmux 3.7's default WheelUpPane forwards the wheel to the app as a mouse event
# whenever alternate_on is set, and WheelDownPane is not bound at all. Result:
# wheel-up was swallowed by an app that ignores mouse events, wheel-down did
# nothing.
#
# Fix: route by capability instead of by screen mode.
#   1. app requested mouse tracking -> forward the event (vim, less, htop)
#   2. app is in alternate screen   -> send arrow keys (Symi, pagers)
#   3. otherwise                    -> tmux copy-mode (normal shell scrollback)
#
# Install: append to ~/.config/tmux/tmux.conf, then `tmux source-file ~/.config/tmux/tmux.conf`

bind -n WheelUpPane   if -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F -t = '#{alternate_on}' 'send-keys -t = Up' 'copy-mode -e'"
bind -n WheelDownPane if -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F -t = '#{alternate_on}' 'send-keys -t = Down' 'copy-mode -e'"

# One arrow key = one display line in Symi, so a single Up/Down per notch is the
# finest step the app supports. Sending three made one notch jump three lines and
# queued keys kept processing after the wheel stopped, which felt like the view
# kept running past where you wanted to stop.

# Shift+wheel always reaches tmux scrollback, even inside a full-screen app,
# so you can still read output from before the app took over the screen.
bind -n S-WheelUpPane   copy-mode -e
bind -n S-WheelDownPane copy-mode -e

# Ctrl+wheel = bigger jumps for long transcripts (one viewport per notch).
bind -n C-WheelUpPane   if -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F -t = '#{alternate_on}' 'send-keys -t = PageUp' 'copy-mode -e'"
bind -n C-WheelDownPane if -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F -t = '#{alternate_on}' 'send-keys -t = PageDown' 'copy-mode -e'"

# Verify which branch a pane takes:
#   tmux display-message -p -t <pane> '#{?mouse_any_flag,FORWARD-MOUSE,#{?alternate_on,SEND-ARROWS,copy-mode}}'
